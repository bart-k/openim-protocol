syntax = "proto3";
package openim.system;

import "sdkws/sdkws.proto";

option go_package = "github.com/openimsdk/protocol/system";

// 请求消息
message CheckUpgradeReq {
  string apiKey = 1; // 平台认证用 API Key
  string appKey = 2;   // 应用唯一标识，例如：'redd'
}

// 响应消息
message CheckUpgradeResp {
  string buildBuildVersion = 1;          // 构建版本
  string forceUpdateVersion = 2;         // 强制更新的版本号
  string forceUpdateVersionNo = 3;       // 强制更新的内部版本号
  bool needForceUpdate = 4;              // 是否强制更新
  string downloadURL = 5;                // 安装包下载链接
  bool buildHaveNewVersion = 6;          // 是否有新版本
  string buildVersionNo = 7;             // 内部版本号
  string buildVersion = 8;               // 可见版本号
  string buildUpdateDescription = 9;     // 更新说明
  string appKey = 10;                    // 应用标识（回传）
  string buildKey = 11;                  // 构建的唯一标识
  string buildName = 12;                 // 应用名称
  string buildIcon = 13;                 // 应用图标链接
  string buildFileKey = 14;              // 安装包文件标识
  string buildFileSize = 15;             // 文件大小（单位：字符串表示的字节数）
}

// 升级服务定义
service system {
  rpc CheckUpgrade(CheckUpgradeReq) returns (CheckUpgradeResp);
}
